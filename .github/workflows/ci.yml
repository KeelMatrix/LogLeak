name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    name: Verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test release resolver and artifact naming
        shell: pwsh
        run: ./build/Test-ReleaseContract.ps1

      - name: Run release-equivalent verification
        shell: pwsh
        run: ./build/Invoke-ReleaseVerification.ps1

      - name: Run dependency audit
        shell: pwsh
        run: ./build/Invoke-DependencyAudit.ps1

      - name: Run package, archive, and consumer gate
        shell: pwsh
        run: ./build/Invoke-PackageGate.ps1 -Stage All
