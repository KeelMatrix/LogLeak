name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      release-date: ${{ steps.release-version.outputs.release-date }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Derive and validate release version
        id: release-version
        shell: pwsh
        run: |
          ./build/Resolve-ReleaseVersion.ps1 `
            -Tag '${{ github.ref_name }}' `
            -RefType $env:GITHUB_REF_TYPE `
            -ExpectedCommit $env:GITHUB_SHA `
            -OutputPath $env:GITHUB_OUTPUT

  platform:
    name: Verify / ${{ matrix.os }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      RELEASE_DATE: ${{ needs.resolve-version.outputs.release-date }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Validate release contract
        shell: pwsh
        run: >-
          ./build/Validate-ReleaseContract.ps1
          -Version $env:RELEASE_VERSION
          -Tag '${{ github.ref_name }}'
          -ExpectedReleaseDate $env:RELEASE_DATE

      - name: Run repository-controlled platform verification
        shell: pwsh
        run: >-
          ./build/Invoke-ReleaseVerification.ps1
          -Version $env:RELEASE_VERSION

  package:
    needs:
      - resolve-version
      - platform
    uses: ./.github/workflows/package-gate.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      upload_artifacts: true
    permissions:
      contents: read

  publish:
    name: Publish exact release artifacts
    needs:
      - resolve-version
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: logleak-release-artifacts
          path: artifacts/packages

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate exact artifact set
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $expected = @(
            "KeelMatrix.LogLeak.$version.nupkg",
            "KeelMatrix.LogLeak.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne $expected.Count -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual)) {
            throw "Unexpected release artifact set. Expected: $($expected -join ', '); actual: $($actual -join ', ')."
          }

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish package
        shell: pwsh
        run: |
          $package = "artifacts/packages/KeelMatrix.LogLeak.$($env:RELEASE_VERSION).nupkg"
          & dotnet nuget push $package `
            --source https://api.nuget.org/v3/index.json `
            --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
            --no-symbols
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package publication failed with exit code $LASTEXITCODE. Symbols were not submitted."
          }

      - name: Publish symbols package
        shell: pwsh
        run: |
          $symbols = "artifacts/packages/KeelMatrix.LogLeak.$($env:RELEASE_VERSION).snupkg"
          & dotnet nuget push $symbols `
            --source https://api.nuget.org/v3/index.json `
            --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet symbols publication failed with exit code $LASTEXITCODE after package publication."
          }
