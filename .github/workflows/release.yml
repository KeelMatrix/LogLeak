name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      release-date: ${{ steps.release-version.outputs.release-date }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Derive and validate release version
        id: release-version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw "Release workflow requires a tag ref, got '$env:GITHUB_REF_TYPE'."
          }
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$') {
            throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          $tagCommit = (git rev-parse --verify "refs/tags/$tag^{commit}").Trim()
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "Tag '$tag' resolves to commit '$tagCommit', but GitHub checked out '$env:GITHUB_SHA'."
          }
          $commitDate = (git show -s --format=%cs $tagCommit).Trim()
          if ($commitDate -notmatch '^\d{4}-\d{2}-\d{2}$') {
            throw "Could not derive an ISO commit date for '$tag'."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release-date=$commitDate" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  platform:
    name: Verify / ${{ matrix.os }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      RELEASE_DATE: ${{ needs.resolve-version.outputs.release-date }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release contract
        shell: pwsh
        run: >-
          ./build/Validate-ReleaseContract.ps1
          -Version $env:RELEASE_VERSION
          -Tag '${{ github.ref_name }}'
          -ExpectedReleaseDate $env:RELEASE_DATE

      - name: Run repository-controlled platform verification
        shell: pwsh
        run: >-
          ./build/Invoke-ReleaseVerification.ps1
          -Version $env:RELEASE_VERSION

  package:
    name: Package / inspect and consume
    needs:
      - resolve-version
      - platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run repository package gate
        shell: pwsh
        run: >-
          ./build/Invoke-PackageGate.ps1
          -Stage All
          -Version $env:RELEASE_VERSION

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: logleak-release-artifacts
          path: artifacts/gate/packages
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact release artifacts
    needs:
      - resolve-version
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: logleak-release-artifacts
          path: artifacts/packages

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate exact artifact set
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $expected = @(
            "KeelMatrix.LogLeak.$version.nupkg",
            "KeelMatrix.LogLeak.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne $expected.Count -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual)) {
            throw "Unexpected release artifact set. Expected: $($expected -join ', '); actual: $($actual -join ', ')."
          }

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish package
        shell: pwsh
        run: >-
          dotnet nuget push
          artifacts/packages/KeelMatrix.LogLeak.${env:RELEASE_VERSION}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'

      - name: Publish symbols package
        shell: pwsh
        run: >-
          dotnet nuget push
          artifacts/packages/KeelMatrix.LogLeak.${env:RELEASE_VERSION}.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
