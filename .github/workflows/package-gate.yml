name: Package gate

on:
  workflow_call:
    inputs:
      version:
        description: Package version passed to the repository package gate.
        required: true
        type: string
      upload_artifacts:
        description: Upload the verified package artifacts for the publishing workflow.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Package version passed to the repository package gate.
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  package:
    name: Package / inspect and consume
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK and required runtimes
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Run repository package gate
        shell: pwsh
        run: >-
          ./build/Invoke-PackageGate.ps1
          -Stage All
          -Version '${{ inputs.version }}'

      - name: Upload verified release artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: logleak-release-artifacts
          path: artifacts/gate/packages
          if-no-files-found: error
          retention-days: 7
